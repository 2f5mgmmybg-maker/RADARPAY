<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RADAR PAYMENT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#030d12;--bg2:#06171f;--line:#0f3a42;--ink:#e4fbf8;--mute:#7fa9ae;--sweep:#35e6cf;--blip:#ffb347;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#0a2a33 0%,var(--bg) 60%);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.rings{position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 50% 18%,transparent 0 46px,rgba(53,230,207,.06) 47px 48px);mask-image:linear-gradient(#000,transparent 85%)}

/* accueil */
#welcome{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;transition:opacity .6s ease,visibility .6s}
#welcome.gone{opacity:0;visibility:hidden}
.radar{position:relative;width:min(70vw,280px);aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:
radial-gradient(circle,transparent 0 24%,rgba(53,230,207,.18) 24.5% 25%,transparent 25.5% 49%,rgba(53,230,207,.18) 49.5% 50%,transparent 50.5% 74%,rgba(53,230,207,.18) 74.5% 75%,transparent 75.5%),
linear-gradient(90deg,transparent 49.7%,rgba(53,230,207,.18) 50%,transparent 50.3%),linear-gradient(transparent 49.7%,rgba(53,230,207,.18) 50%,transparent 50.3%);
box-shadow:0 0 60px rgba(53,230,207,.12),inset 0 0 40px rgba(53,230,207,.08);overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(53,230,207,0) 0 70%,rgba(53,230,207,.55) 100%);animation:spin 3.2s linear infinite}
.radar i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--blip);box-shadow:0 0 12px var(--blip);opacity:0;animation:blip 3.2s linear infinite}
.radar i:nth-child(1){left:68%;top:30%;animation-delay:.6s}
.radar i:nth-child(2){left:30%;top:62%;animation-delay:1.7s}
.radar i:nth-child(3){left:60%;top:74%;animation-delay:2.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1.3)}40%{opacity:.7;transform:scale(1)}100%{opacity:0}}
#welcome h1{margin:0;font-size:2.1rem;font-weight:700;letter-spacing:.01em}
#welcome p{margin:0;color:var(--mute);font-weight:300;line-height:1.6;max-width:30ch}
.btn{border:1px solid var(--sweep);background:rgba(53,230,207,.1);color:var(--sweep);font:600 1rem Sora,system-ui,sans-serif;padding:14px 38px;border-radius:999px;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn:hover{background:rgba(53,230,207,.2);box-shadow:0 0 24px rgba(53,230,207,.3)}

/* app */
main{position:relative;max-width:560px;margin:0 auto;padding:22px 18px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--sweep);box-shadow:0 0 0 0 rgba(53,230,207,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(53,230,207,0)}100%{box-shadow:0 0 0 0 rgba(53,230,207,0)}}
header h2{margin:0;font-size:1.15rem;font-weight:700}
header span{margin-left:auto;color:var(--mute);font-size:.8rem}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{position:relative;z-index:1;background:none;border:0;color:var(--mute);font:600 .76rem Sora,system-ui,sans-serif;padding:12px 6px;cursor:pointer;transition:color .3s}
.tabs button.on{color:var(--bg)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(33.333% - 2.7px);border-radius:999px;background:var(--sweep);box-shadow:0 0 22px rgba(53,230,207,.4);transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.tabs.two .pill{transform:translateX(100%)}
section{display:none}
section.on{display:block;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.lead{color:var(--mute);font-weight:300;font-size:.92rem;line-height:1.6;margin:0 0 16px}

.row{display:flex;align-items:center;gap:14px;padding:16px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(100deg,rgba(53,230,207,.07),transparent 60%),var(--bg2);color:inherit;text-decoration:none;transition:transform .25s,border-color .25s,box-shadow .25s}
.row:hover{border-color:var(--sweep);box-shadow:0 0 28px rgba(53,230,207,.12)}
.row:active{transform:scale(.98)}
.blip{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:radial-gradient(circle,rgba(255,179,71,.25),transparent 70%)}
.blip::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--blip);box-shadow:0 0 12px var(--blip)}
.row b{display:block;font-weight:600;font-size:1rem}
.row small{color:var(--mute);font-weight:300}
.go{margin-left:auto;color:var(--sweep);font-size:1.3rem}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:22px;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:.8rem;padding:12px;background:var(--bg2);overflow:hidden}
.slot{position:relative;padding:0;border-style:solid;cursor:pointer;transition:transform .25s}
.slot:active{transform:scale(.97)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.empty{border-style:dashed;cursor:default}
.price{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(3,13,18,.93));font-weight:700;font-size:1rem;text-align:left}
.price:empty{display:none}
.stamp:empty{display:none}
#lb{position:fixed;inset:0;z-index:30;background:rgba(3,13,18,.97);display:none;flex-direction:column;align-items:center;gap:14px;padding:16px}
#lb.on{display:flex;animation:in .25s ease both}
#lb .box{width:100%;max-width:560px;flex:1;min-height:0;overflow:auto;display:flex;border-radius:20px}
#lb img{margin:auto;flex:none;max-width:100%;max-height:100%;cursor:zoom-in;transition:width .3s}
#lb img.z{max-width:none;max-height:none;width:220%;cursor:zoom-out}
#lb b{font-size:1.2rem}
.adm{display:none;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.adm.on{display:flex}
.btn.s{padding:10px 18px;font-size:.85rem}
.ctl{position:absolute;left:0;right:0;bottom:0;padding:8px;display:flex;gap:6px;background:rgba(3,13,18,.92)}
.ctl input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font:600 .85rem Sora,system-ui,sans-serif}
.ctl button{background:none;border:1px solid var(--line);color:var(--blip);border-radius:10px;padding:0 10px;font-size:1rem}
.stamp{display:flex;align-items:center;gap:8px;color:var(--blip);font-size:.85rem;margin-bottom:14px}
.stamp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blip);box-shadow:0 0 10px var(--blip)}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px;margin:0 0 10px;font:600 1rem Sora,system-ui,sans-serif}
#lb small{color:var(--mute);text-align:center}
#chatlist{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.chatitem{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;cursor:pointer}
.chatitem small{display:block;color:var(--mute);margin-top:5px}
#chatui{position:fixed;inset:0;z-index:50;background:rgba(3,13,18,.98);padding:18px;display:flex;flex-direction:column;gap:12px}
#chatui[hidden]{display:none}
#chatmessages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px}
.chatmsg{max-width:88%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);white-space:pre-wrap;overflow-wrap:anywhere}
.chatmsg.mine{align-self:flex-end;border-color:var(--sweep)}
.chatmsg small{display:block;color:var(--mute);font-size:.7rem;margin-top:5px}
.chatbar{display:flex;gap:8px}
.chatbar input{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="rings"></div>

<div id="welcome">
  <div class="radar"><i></i><i></i><i></i></div>
  <h1>Bienvenue</h1>
  <button class="btn" id="enter">Entrer</button>
</div>

<main>
  <header><div class="dot"></div><h2>RADAR PAYMENT 💡</h2><span>en direct</span></header>

  <div class="tabs" id="tabs">
    <div class="pill"></div>
    <button class="on" data-t="a">Paiement en ligne</button>
    <button data-t="b">Disponibilité physique</button>
    <button data-t="c">Admin</button>
  </div>

  <section id="a" class="on">
    <p class="lead">Choisis un service, tu seras redirigé vers le site.</p>
    <div id="list"></div>
  </section>

  <section id="c">
    <div id="gate"><p class="lead">Espace vendeur. Entre ton code d’accès.</p>
      <input class="inp" id="code" inputmode="numeric" placeholder="Code d’accès" autocomplete="off">
      <button class="btn s" id="go">Entrer</button><p class="lead" id="msg"></p></div>
    <div id="panel" hidden><p class="lead">Ajoute une photo avec son prix.</p>
      <input class="inp" id="pp" placeholder="Prix (ex : 120 €)">
      <button class="btn s" id="addp">Choisir une photo</button><input type="file" id="pf" accept="image/*" hidden>
      <p class="lead" id="pm"></p><div class="grid" id="mine"></div><div id="chatlist"><h3>Discussions privées</h3><p class="lead">Toutes les conversations et commandes.</p><div id="chatitems"></div></div></div>
  </section>

  <section id="b">
    <div class="stamp" id="stamp"></div>
    <p class="lead">Touche une photo pour l’agrandir.</p>
    <div class="adm" id="adm"><button class="btn s" id="add">Ajouter une photo</button><button class="btn s" id="save">Enregistrer</button><input type="file" id="file" accept="image/*" hidden></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div id="chatui" hidden><div style="display:flex;align-items:center;gap:10px"><b id="chatheading">Discussion</b><button class="btn s" id="chatclose" style="margin-left:auto">Fermer</button></div><p class="lead" id="chatstatus"></p><div id="chatmessages"></div><div class="chatbar"><input class="inp" id="chattext" placeholder="Ton message…" maxlength="1500"><button class="btn s" id="chatsend">Envoyer</button></div><p class="lead" id="chaterror"></p></div>
<script type="application/json" id="state">{"photos":[],"maj":""}</script>
<script>
// ➜ Les liens des boutons : on peut changer l’adresse de chaque ligne ici.
var SERVICES=[
 {n:"Cartes cadeaux ON",d:"Carte cadeau numérique ON",u:"https://www.on.com/en-es/products/digital-gift-card-907644gc"},
 {n:"Prada",d:"Site officiel",u:"https://www.prada.com"},
 {n:"Farfetch",d:"Mode de luxe",u:"https://www.farfetch.com"},
 {n:"Zeitauktion",d:"Enchères",u:"https://www.zeitauktion.com/fr"},
 {n:"Watchdeluxe.it",d:"Montres de luxe",u:"https://www.watchdeluxe.it"},
 {n:"Paysafe Card",d:"Paiement prépayé",u:"https://www.paysafecard.com"}
];
var ST=JSON.parse(document.getElementById("state").textContent);var PHOTOS=ST.photos;var ADMIN=false;

var list=document.getElementById("list");
SERVICES.forEach(function(s){
  var a=document.createElement("a");a.className="row";a.href=s.u;
  if(s.u!=="#"){a.target="_blank";a.rel="noopener"}
  a.innerHTML='<div class="blip"></div><div><b>'+s.n+'</b><small>'+s.d+'</small></div><span class="go">›</span>';
  list.appendChild(a);
});

var grid=document.getElementById("grid");
function render(){
  grid.innerHTML="";
  if(!PHOTOS.length){var e=document.createElement("div");e.className="slot empty";e.style.gridColumn="1/-1";e.style.aspectRatio="auto";e.style.padding="28px 12px";e.textContent=ADMIN?"Ajoute ta première photo.":"Pas encore de photo aujourd’hui.";grid.appendChild(e)}
  PHOTOS.forEach(function(p,i){
    var d=document.createElement("div");d.className="slot";
    var im=document.createElement("img");im.src=p.src;im.alt="";d.appendChild(im);
    if(ADMIN){
      var c=document.createElement("div");c.className="ctl";
      var inp=document.createElement("input");inp.placeholder="Prix";inp.value=p.prix||"";inp.oninput=function(){p.prix=inp.value};
      var x=document.createElement("button");x.textContent="✕";x.onclick=function(){PHOTOS.splice(i,1);render()};
      c.appendChild(inp);c.appendChild(x);d.appendChild(c);
    }else{
      var pr=document.createElement("div");pr.className="price";pr.textContent=p.prix||"";d.appendChild(pr);
      d.onclick=function(){openLb(p)};
    }
    grid.appendChild(d);
  });
  document.getElementById("stamp").textContent=ST.maj?"Mis à jour le "+ST.maj:"";
}
function openLb(p){
  var l=document.getElementById("lb");
  if(!l){l=document.createElement("div");l.id="lb";l.innerHTML='<div class="box"><img alt=""></div><b id="lbp"></b><button class="btn s" id="lbw">Je le veux</button><button class="btn s" id="lbx">Fermer</button><small id="lbm"></small>';document.body.appendChild(l);
    var i0=l.querySelector("img");i0.onclick=function(){i0.classList.toggle("z")};
    l.querySelector("#lbx").onclick=function(){l.classList.remove("on")};
    var w=l.querySelector("#lbw"),m=l.querySelector("#lbm");
    w.onclick=function(){
      if(w.dataset.s!=="1"){w.dataset.s="1";w.textContent="Confirmer";m.textContent="Ton information (ton nom Telegram) sera transmise au spitta. Dans 50 secondes, tu auras une réponse.";return}
      w.disabled=true;m.textContent="Envoi…";
      ask().then(function(){return call("/api/want",{id:CUR.id})}).then(function(r){m.textContent=r.ok?(r.notification===false?(r.error||"Discussion créée, notification non confirmée."):"Le vendeur est prévenu. Ouvre la discussion pour échanger."):(r.error||"Réessaie.");w.textContent="Envoyé";if(r.chat)openChat(r.chat)})
      .catch(function(){m.textContent="Le serveur se réveille. Réessaie dans 30 secondes.";w.disabled=false;w.dataset.s="";w.textContent="Je le veux"})};}
  var im=l.querySelector("img");im.classList.remove("z");im.src=p.src;
  l.querySelector("#lbp").textContent=p.prix||"";CUR=p;var w0=l.querySelector("#lbw");w0.disabled=false;w0.dataset.s="";w0.textContent="Je le veux";l.querySelector("#lbm").textContent="";l.classList.add("on");
}
function shrink(file,cb){
  var img=new Image();
  img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78));URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(file);
}
function save(art){
  ST.photos=PHOTOS;ST.maj=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  var root=document.documentElement.cloneNode(true);
  root.querySelector("#state").textContent=JSON.stringify(ST).replace(/</g,"\\u003c");
  root.querySelector("#list").innerHTML="";root.querySelector("#grid").innerHTML="";root.querySelector("#stamp").textContent="";
  root.querySelector("#welcome").classList.remove("gone");
  var l=root.querySelector("#lb");if(l)l.remove();
  root.querySelector("#adm").classList.remove("on");
  root.querySelector("#tabs").classList.remove("two");
  root.querySelectorAll("#tabs button").forEach(function(b,i){b.classList.toggle("on",i===0)});
  root.querySelectorAll("section").forEach(function(s,i){s.classList.toggle("on",i===0)});
  art.publish("<!DOCTYPE html>\n"+root.outerHTML).catch(function(){alert("Enregistrement impossible. Réessaie.")});
}
function setup(){
  if(!window.claude||!claude.use)return;
  Promise.all([claude.use("user"),claude.use("artifact")]).then(function(r){
    var u=r[0],art=r[1];
    if(!u||!art||!u.canEdit())return;
    ADMIN=true;document.getElementById("adm").classList.add("on");render();
    var f=document.getElementById("file");
    document.getElementById("add").onclick=function(){f.click()};
    f.onchange=function(){var file=f.files[0];if(!file)return;shrink(file,function(src){PHOTOS.push({src:src,prix:""});render();f.value=""})};
    document.getElementById("save").onclick=function(){save(art)};
  }).catch(function(){});
}
var tgw=window.Telegram&&Telegram.WebApp;if(tgw){tgw.ready();tgw.expand()}
var INIT=tgw?tgw.initData:"",API="",CUR=null,CODE="",ACTIVE_CHAT=null;
function call(path,body){
  if(!API || !/^https?:\/\//i.test(API)){
    return Promise.reject(new Error("Adresse API absente de photos.json. Vérifie GITHUB_REPO et le démarrage Render."));
  }
  body=body||{};body.initData=INIT;body.code=CODE;
  var controller=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=controller?setTimeout(function(){controller.abort()},35000):null;
  return fetch(API.replace(/\/$/,"")+path,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body),
    signal:controller?controller.signal:undefined,
    cache:"no-store"
  }).then(function(r){
    if(!r.ok) throw new Error("Erreur HTTP "+r.status);
    return r.text();
  }).then(function(raw){
    var data;
    try{data=JSON.parse(raw)}catch(e){throw new Error("Réponse API invalide (JSON).")}
    if(!data || typeof data!=="object") throw new Error("Réponse API invalide.");
    return data;
  }).catch(function(e){
    if(e && e.name==="AbortError") throw new Error("Délai API dépassé (20 secondes).");
    throw e;
  }).finally(function(){if(timer)clearTimeout(timer)});
}
function $(i){return document.getElementById(i)}
function ask(){return new Promise(function(res){var t=setTimeout(res,8000);try{if(tgw&&tgw.requestWriteAccess){tgw.requestWriteAccess(function(){clearTimeout(t);res()})}else{clearTimeout(t);res()}}catch(e){clearTimeout(t);res()}})}
function showMe(r,fromCode){
  var ok=!!r.role;$("gate").hidden=ok;$("panel").hidden=!ok;
  if(!ok){$("msg").textContent=r.error||(fromCode?"Code incorrect.":"Accès administrateur indisponible.");return}
  var m=$("mine");m.innerHTML="";
  loadChatList();
  PHOTOS.filter(function(p){return (r.mine||[]).indexOf(p.id)>-1}).forEach(function(p){
    var d=document.createElement("div");d.className="slot";
    var im=document.createElement("img");im.src=p.src;d.appendChild(im);
    var pr=document.createElement("div");pr.className="price";pr.textContent=p.prix||"";d.appendChild(pr);
    var x=document.createElement("button");x.className="btn s";x.textContent="Supprimer";x.style.cssText="position:absolute;top:8px;right:8px";
    x.onclick=function(){x.disabled=true;call("/api/delete",{id:p.id}).then(function(){PHOTOS=PHOTOS.filter(function(q){return q.id!==p.id});render();adminOpen()})};
    d.appendChild(x);m.appendChild(d)});
}
function loadChatList(){
  call("/api/chat/list",{}).then(function(r){
    var host=$("chatitems");if(!host)return;host.innerHTML="";
    (r.chats||[]).forEach(function(c){
      var b=document.createElement("button");b.className="chatitem";
      b.textContent=(c.client_name||"Acheteur")+" — "+(c.price||"sans prix")+" — "+(c.status||"en cours");
      var small=document.createElement("small");small.textContent=c.last||"Aucun message";b.appendChild(small);
      b.onclick=function(){openChat(c.id)};host.appendChild(b);
    });
    if(!host.children.length)host.textContent="Aucune discussion pour le moment.";
  }).catch(function(e){$("pm").textContent=(e&&e.message)||"Impossible de charger les discussions."});
}
function renderMessages(c){
  $("chatheading").textContent="Discussion — "+(c.price||"commande");
  $("chatstatus").textContent="État : "+(c.status==="accepted"?"confirmée — vendeur engagé":c.status==="declined"?"indisponible":c.status==="expired"?"délai dépassé":"en attente");
  var host=$("chatmessages");host.innerHTML="";
  (c.messages||[]).forEach(function(m){
    var d=document.createElement("div");d.className="chatmsg"+(m.from===Number((tgw&&tgw.initDataUnsafe&&tgw.initDataUnsafe.user&&tgw.initDataUnsafe.user.id)||0)?" mine":"");
    d.textContent=(m.name||"Utilisateur")+": "+m.text;
    var small=document.createElement("small");small.textContent=new Date((m.time||0)*1000).toLocaleString("fr-FR");d.appendChild(small);host.appendChild(d);
  });
  host.scrollTop=host.scrollHeight;
}
function openChat(id){
  ACTIVE_CHAT=id;$("chatui").hidden=false;$("chaterror").textContent="Chargement…";
  call("/api/chat/messages",{id:id}).then(function(r){if(!r.ok)throw new Error(r.error||"Discussion indisponible.");renderMessages(r.chat);$("chaterror").textContent=""})
  .catch(function(e){$("chaterror").textContent=(e&&e.message)||"Impossible d’ouvrir la discussion."});
}
$("chatclose").onclick=function(){$("chatui").hidden=true;ACTIVE_CHAT=null};
$("chatsend").onclick=function(){
  var txt=$("chattext").value.trim();if(!ACTIVE_CHAT||!txt)return;$("chatsend").disabled=true;
  call("/api/chat/send",{id:ACTIVE_CHAT,text:txt}).then(function(r){if(!r.ok)throw new Error(r.error||"Envoi impossible.");$("chattext").value="";return call("/api/chat/messages",{id:ACTIVE_CHAT})})
  .then(function(r){renderMessages(r.chat);$("chaterror").textContent=""}).catch(function(e){$("chaterror").textContent=(e&&e.message)||"Envoi impossible."}).finally(function(){$("chatsend").disabled=false});
};
$("chattext").addEventListener("keydown",function(e){if(e.key==="Enter")$("chatsend").click()});
function adminOpen(){if(!INIT){$("msg").textContent="Ouvre l’app depuis Telegram.";return}
  call("/api/me",{}).then(function(r){showMe(r,false) }).catch(function(e){$("msg").textContent=(e&&e.message)||"Connexion à l’API impossible. Vérifie la configuration Render."})}
$("go").onclick=function(){CODE=$("code").value.trim();$("msg").textContent="Vérification…";
  call("/api/me",{}).then(function(r){showMe(r,true) }).catch(function(e){$("msg").textContent=(e&&e.message)||"Connexion à l’API impossible. Vérifie la configuration Render."})};
$("addp").onclick=function(){$("pf").click()};
$("pf").onchange=function(){var f=this.files[0];this.value="";if(!f)return;$("pm").textContent="Envoi…";
  shrink(f,function(src){call("/api/add",{image:src,prix:$("pp").value}).then(function(r){$("pm").textContent=r.ok?"Ajoutée. Visible dans 1 à 2 minutes.":(r.error||"Erreur.");if(r.ok)$("pp").value="" }).catch(function(e){$("pm").textContent=(e&&e.message)||"Connexion à l’API impossible."})})};
fetch("photos.json?"+Date.now(),{cache:"no-store"}).then(function(r){
  if(!r.ok)throw new Error("photos.json HTTP "+r.status);
  return r.json();
}).then(function(d){
  PHOTOS=(d.photos||[]).map(function(p){return {src:"photos/"+p.image,prix:p.prix||"",id:p.id}});
  ST.maj=d.maj||"";
  API=(d.api||"").trim().replace(/\/$/,"");
  render();
}).then(function(){
  var cid=new URLSearchParams(location.search).get("chat");if(cid)openChat(cid);
}).catch(function(e){
  console.error("RADAR PAYMENT: impossible de charger photos.json",e);
  render();
});

var tabs=document.getElementById("tabs");
tabs.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  tabs.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});
  tabs.querySelector(".pill").style.transform="translateX("+["a","b","c"].indexOf(b.dataset.t)*100+"%)";if(b.dataset.t==="c")adminOpen();
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===b.dataset.t)});
  if(navigator.vibrate)navigator.vibrate(8);
});
document.getElementById("enter").onclick=function(){document.getElementById("welcome").classList.add("gone")};
</script>
</body>
