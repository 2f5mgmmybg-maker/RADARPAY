name: RADARPAY checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q bot.py tests
      - name: Lancer les tests
        run: python -m unittest discover -s tests -v
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("Script JavaScript introuvable")
          Path("/tmp/radarpay-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/radarpay-inline.js
