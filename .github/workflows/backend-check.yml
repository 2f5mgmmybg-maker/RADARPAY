name: Backend syntax check

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "index.html"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "bot.py"
      - "index.html"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backend-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile bot.py
      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\btype=['\"]application/json['\"])[^>]*>(.*?)</script\s*>", html, flags=re.I | re.S)
          inline = [script for script in scripts if script.strip()]
          Path("/tmp/radar-inline.js").write_text("\n;\n".join(inline), encoding="utf-8")
          print(f"Checking {len(inline)} inline script(s)")
          PY
          node --check /tmp/radar-inline.js
      - name: Audit frontend IDs and API route coverage
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          backend = Path("bot.py").read_text(encoding="utf-8")
          ids = re.findall(r'\\bid=["\\']([^"\\']+)["\\']', html)
          duplicates = [key for key, count in Counter(ids).items() if count > 1]
          references = set(re.findall(r'\\$\\(["\\']([^"\\']+)["\\']\\)', html))
          missing_ids = sorted(references - set(ids))
          frontend_routes = set(re.findall(r'call\\(\\s*["\\']([^"\\']+)["\\']', html))
          backend_routes = set(re.findall(r'if path == ["\\']([^"\\']+)["\\']:', backend))
          missing_routes = sorted(frontend_routes - backend_routes)

          assert not duplicates, f"Duplicate HTML IDs: {duplicates}"
          assert not missing_ids, f"Missing DOM IDs: {missing_ids}"
          assert not missing_routes, f"Frontend calls without backend routes: {missing_routes}"
          print(f"Audited {len(ids)} DOM IDs and {len(frontend_routes)} literal API routes.")
          PY
